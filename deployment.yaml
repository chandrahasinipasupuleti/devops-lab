apiVersion: apps/v1
kind: Deployment

metadata:
  name: event-registration

spec:
  replicas: 2

  selector:
    matchLabels:
      app: event-registration

  template:
    metadata:
      labels:
        app: event-registration

    spec:
      containers:
        - name: event-registration
          image: event-registration:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
